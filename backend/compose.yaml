# Dịch vụ phụ cho môi trường dev. Chạy: docker compose -f backend/compose.yaml up -d minio redis
# PostgreSQL vẫn cài thẳng trên máy như trước; ở đây có kho tệp đính kèm và bộ nhớ đệm dùng chung.
# Redis không bắt buộc: chạy app với REDIS_HOST=localhost REDIS_PORT=6380 thì dùng, không thì thôi.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Khớp app.storage.access-key / secret-key mặc định trong application.properties.
      MINIO_ROOT_USER: sfems
      MINIO_ROOT_PASSWORD: sfems-dev-secret
    ports:
      - "9100:9000" # S3 API — backend nói chuyện ở đây (9000 hay bị MinIO của dự án khác chiếm)
      - "9101:9001" # bảng điều khiển web
    volumes:
      - minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379" # 6379 hay bị Redis của dự án khác chiếm
    restart: unless-stopped

volumes:
  minio-data:
