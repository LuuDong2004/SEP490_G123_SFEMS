spring.application.name=sfems

# --- Web --------------------------------------------------------------------
# Cổng HTTP. Đổi khỏi 8080 mặc định vì máy phát triển thường đã có thứ khác
# chiếm cổng đó; ghi đè bằng biến môi trường SERVER_PORT thay vì sửa file này
# cho từng máy.
server.port=8888
# Sau nginx: Tomcat lấy IP client từ X-Forwarded-For, nhưng CHỈ tin phần do proxy nội bộ (IP riêng: mạng
# docker, 127.0.0.1) thêm vào — phần client tự viết vào header không thành IP của request.
server.forward-headers-strategy=native

# --- Datasource -------------------------------------------------------------
# Local PostgreSQL. Override any of these with the matching SPRING_DATASOURCE_*
# environment variable rather than editing this file per machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/sfems
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikari mặc định 10 kết nối. Mỗi yêu cầu giữ một kết nối suốt giao dịch, nên
# pool là trần số yêu cầu chạy song song; đặt theo số lõi máy chủ CSDL (khoảng
# 2 × lõi + số ổ), không theo số người dùng.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
# Chờ kết nối tối đa 5 giây (mặc định Hikari 30 giây). Pool cạn thì yêu cầu thứ 21
# trở đi xếp hàng; chờ 30 giây là 180 luồng Tomcat treo cùng lúc và người dùng thấy
# màn hình đứng im — 5 giây rồi báo lỗi còn hơn, vì chỉ tiêu đáp ứng là 2 giây.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:5000}
# Một kết nối bị giữ quá 60 giây thì ghi WARN kèm stack của chỗ mượn — chỉ ghi log,
# không đóng kết nối; là cách tìm ra service giữ kết nối khi đang làm việc khác.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:60000}
# Trần thời gian MỘT câu SQL: quá thì driver huỷ câu đó và yêu cầu nhận lỗi,
# thay vì một câu tổng hợp lạc giữ một kết nối hàng phút. Đặt ở JdbcTemplate và JPA
# (Statement.setQueryTimeout), KHÔNG đặt statement_timeout cho cả kết nối
# (connection-init-sql hay options=-c trong URL), vì:
#  - Liquibase dùng chung DataSource — một changelog đổi dữ liệu trên bảng lớn hay tạo
#    chỉ mục được phép chạy lâu hơn 30 giây;
#  - sao lưu / khôi phục chạy pg_dump / pg_restore ở tiến trình riêng, không qua đây;
#  - "Xuất toàn bộ dữ liệu" đọc cả bảng bằng con trỏ — DataExportService dùng một
#    JdbcTemplate riêng, không mang trần này.
# Đặt URL qua SPRING_DATASOURCE_URL cũng không làm mất trần như cách options=-c.
spring.jdbc.template.query-timeout=${DB_QUERY_TIMEOUT:30s}
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:30000}

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only validates that the entities and the
# migrated tables still agree, so a drifted mapping fails at startup instead of
# at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Nạp quan hệ theo lô: một danh sách 20 phiếu, mỗi phiếu vài dòng, mỗi dòng một
# tài sản kéo nhóm / phòng / cán bộ — không có dòng này là mỗi thứ một câu SELECT
# riêng, và dưới tải các câu đó xếp hàng chờ kết nối. Đo tại máy (100 luồng):
# danh sách phiếu mượn p50 2,7 s -> xem ghi chú P9.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Liên kết EAGER chỉ được JOIN MỘT tầng; sâu hơn thì nạp bằng SELECT riêng (gom lô 50
# theo dòng trên). Mặc định Hibernate JOIN theo cả chuỗi EAGER: danh sách phiếu nhập ra
# một câu JOIN 45 bảng (dòng phiếu -> phòng -> khối nhà -> cơ sở -> cán bộ -> trường...),
# local 0,15 s nhưng server dev 25,7 s — Postgres lập kế hoạch cho 45 bảng tốn CPU. Đặt
# ở đây thay vì @Fetch(SELECT) từng trường để thực thể MỚI khai EAGER cũng không tái
# phát. Đo local: câu rộng nhất 45 -> 5 JOIN, số câu 9 -> 11, JSON trả về giống hệt.
spring.jpa.properties.hibernate.max_fetch_depth=1
# Gom lệnh ghi theo lô. Mọi khoá ở đây là IDENTITY nên INSERT của thực thể KHÔNG gom được (Hibernate phải
# đọc id ngay sau từng câu) — thứ được lợi là UPDATE / DELETE hàng loạt, vd. duyệt một phiếu đổi trạng thái
# vài trăm tài sản. INSERT số lượng lớn (lịch sử thiết bị lúc ghi tăng) đi qua JdbcTemplate.batchUpdate.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
# Tên stack (APP_STACK) cho changeset chỉ chạy ở một môi trường — 210 xoá dữ liệu demo chỉ ở qltb_main.
spring.liquibase.parameters.appStack=${app.stack}

# --- JSON -------------------------------------------------------------------
# Jackson 3 (Boot 4) already writes java.time values as ISO-8601 strings, which
# is what the admin UI needs 'new Date()' to be able to parse; only the zone
# has to be pinned so timestamps do not shift with the server default.
spring.jackson.time-zone=UTC
# Số lẻ gửi vào ô số NGUYÊN là lỗi, không phải thứ để cắt bớt: mặc định Jackson nhận 1.5 cho một ô
# Integer và lặng lẽ lưu 1 — phiếu nhập "1,5 cái" thành 1 cái mà không ai được báo.
spring.jackson.deserialization.accept-float-as-int=false

# --- Security ---------------------------------------------------------------
# HMAC key the access tokens are signed with. HS256 needs at least 32 bytes and
# the application refuses to start with less. The value below is a development
# default and is in version control, which is exactly why every deployment must
# override it with APP_SECURITY_JWT_SECRET: anyone holding this string can
# mint a token for any account.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
# Tên stack của deploy/docker-compose.yml (qltb_dongdev, qltb-uat, qltb_main); trống trên máy dev.
# Có tên stack thì không khởi động với khoá JWT mặc định ở trên; qltb_main còn tự khoá tài khoản
# demo, đóng trang tài liệu API và không ghi nội dung thư ra log (DeployStack).
app.stack=${APP_STACK:}
# qltb_main khoá cả 'admin' nếu còn mật khẩu seed; true = giữ 'admin' mở MỘT lần để vào đổi mật khẩu (DemoAccountGuard).
app.security.keep-seeded-admin=${APP_KEEP_SEEDED_ADMIN:false}
# Có khoá tài khoản demo trên qltb_main không. Mặc định trong app là CÓ (an toàn khi thiếu biến); compose đặt
# false khi hệ thống còn thử nghiệm (LOCK_DEMO_ACCOUNTS).
app.security.lock-demo-accounts=${APP_LOCK_DEMO_ACCOUNTS:true}
app.security.jwt.issuer=sfems
# Short, because nothing can revoke an access token before it expires: this is
# how long a role change or a disabled account takes to actually bite.
app.security.jwt.access-token-ttl=15m
# How long a session survives without signing in again. Rotated on every use.
app.security.jwt.refresh-token-ttl=7d

# --- Cổng Admin cách ly (docs/kien-truc/11, quyết định 4) ---------------------
# Tài khoản quản trị hệ thống (SYSTEM) chỉ đăng nhập ở /admin/login (khu "admin"); khu nghiệp vụ /login không nhận.
# Bắt buộc lớp xác thực thứ hai (mã qua email): chưa bật thì mọi API ngoài /api/auth/** trả 403.
# TẠM TẮT (mặc định false) trong giai đoạn kiểm thử — bật lại bằng APP_PORTAL_ADMIN_MFA_REQUIRED=true.
app.portal.admin-mfa-required=${APP_PORTAL_ADMIN_MFA_REQUIRED:false}
# IP / dải CIDR được vào khu quản trị, cách nhau dấu phẩy (vd. 10.0.0.0/8,203.0.113.7); trống = không giới hạn.
# So với IP Tomcat đã lấy từ proxy tin cậy (server.forward-headers-strategy ở trên), không đọc X-Forwarded-For thô.
app.portal.admin-allowed-ips=${APP_PORTAL_ADMIN_ALLOWED_IPS:}
# Phiên của tài khoản SYSTEM dài tối đa bao lâu từ lúc đăng nhập (làm mới token không kéo dài quá mốc này).
app.portal.admin-session-ttl=${APP_PORTAL_ADMIN_SESSION_TTL:8h}
# Hạn access token của tài khoản SYSTEM (ngắn hơn hạn chung ở trên).
app.portal.admin-access-token-ttl=${APP_PORTAL_ADMIN_ACCESS_TOKEN_TTL:5m}

# --- CORS -------------------------------------------------------------------
# The Vite dev server. Vite selects the next free port when a local instance is
# already running, so allow localhost development origins on any port.
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# --- HTTP connector ---------------------------------------------------------
# Square brackets are legal here because Refine's data provider sends them:
# `getMany` builds `?ids[0]=1&ids[1]=2` through qs, which encodes values but not
# keys, and the browser's URL parser leaves `[` and `]` alone in a query string.
#
# Tomcat rejects them by default -- they are gen-delims that RFC 3986 does not
# permit outside a host -- and it does so in the connector, before any filter
# runs. That produces a 400 HTML page with no CORS headers, so the browser
# reports the failure as a CORS error on the preflight and the real cause is
# nowhere in it. `ListParams.ids()` already parses `ids[0]`; the request simply
# never reached it.
#
# Two characters, in the query string only. The path parser is untouched.
server.tomcat.relaxed-query-chars=[,]

# --- Actuator ---------------------------------------------------------------
# Health only, and details only for a caller that authenticated. The row-level
# indicator turns the check DOWN while any policy is quarantined and lists which
# ones -- a policy that is not applying is a security control that is not
# applying, and the whole point of quarantining rather than refusing to start is
# that it must not then be invisible. Without details the check says DOWN and
# nothing else, which is a page at 3am with nowhere to go.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized


# --- Tệp đính kèm -------------------------------------------------------------
# Controller tự giới hạn 10 MB và nói bằng tiếng Việt; giới hạn ở đây cao hơn một
# chút để request tới được controller thay vì bị servlet cắt với lỗi chung.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Nội dung tệp nằm trong MinIO; database chỉ giữ tên, loại, dung lượng và khoá đối tượng.
# Dev: `docker compose -f backend/compose.yaml up -d minio` (bảng điều khiển ở :9101).
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9100}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:sfems}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:sfems-dev-secret}
app.storage.bucket=${APP_STORAGE_BUCKET:sfems-attachments}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
# Thông số riêng từng máy (MinIO dùng chung của nhóm, mật khẩu...) để trong
# backend/application-local.properties — đã gitignore; mẫu ở application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# --- Thư điện tử (shared/mail/MailService) ------------------------------------
# Máy chủ SMTP KHÔNG khai ở đây: khai spring.mail.host / port / username / password trong
# application-local.properties (Mailpit khi dev, Gmail khi demo — mẫu ở application-local.properties.example)
# hoặc biến môi trường SPRING_MAIL_HOST... Chưa khai thì thư chỉ được ghi ra log (dev).
app.mail.from=${APP_MAIL_FROM:SFEMS <no-reply@sfems.local>}
spring.mail.default-encoding=UTF-8
# Máy chủ thư treo thì bỏ sau vài giây thay vì giữ luồng gửi mãi.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Địa chỉ giao diện để dựng link trong thư (đặt lại mật khẩu, "Xem trên hệ thống").
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5555}

# ---- P9: sao lưu và cảnh báo dung lượng
# pg_dump phải có trên PATH, hoặc đặt đường dẫn đầy đủ qua APP_BACKUP_PG_DUMP.
app.backup.pg-dump=${APP_BACKUP_PG_DUMP:pg_dump}
# pg_restore cho nút Khôi phục; để trống thì lấy cạnh pg_dump.
app.backup.pg-restore=${APP_BACKUP_PG_RESTORE:}
# Nên là một ổ khác ổ chứa cơ sở dữ liệu.
app.backup.dir=${APP_BACKUP_DIR:./backups}
app.backup.retention=14
app.backup.cron=0 30 1 * * *
app.backup.max-age-hours=36
app.capacity.disk-min-free-gb=5
app.capacity.database-max-gb=50
app.capacity.check-cron=0 0 6 * * *

# ---- Phiếu mượn: nhắc người lập phiếu trước hạn trả bấy nhiêu ngày (0 = chỉ nhắc ngày đến hạn, số âm = tắt).
app.loans.remind-before-days=1

# ---- Nhắc bảo trì: các mốc (số ngày trước hạn), mỗi mốc nhắc một lần.
app.maintenance.remind-before-days=7,1

# ---- Tài liệu API: /swagger-ui.html, /v3/api-docs. Mặc định TẮT (không lộ danh sách endpoint); bật trên máy dev: APP_API_DOCS=true.
springdoc.api-docs.enabled=${APP_API_DOCS:false}
springdoc.swagger-ui.enabled=${APP_API_DOCS:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ---- AI gợi ý: bật / tắt, khoá, mô hình chỉnh ở màn Quản trị hệ thống → "Cấu hình AI" (bảng ai_settings, 160).
# Khoá nhập trên màn hình được ưu tiên; để trống thì dùng khoá của máy chủ dưới đây.
app.ai.api-key=${ANTHROPIC_API_KEY:}

# ---- Bộ nhớ đệm dùng chung (Redis 8, HSDT TL 4.1.10) ----------------------------------------
# Mức 2 sau bộ nhớ đệm trong từng node: bảng tổng hợp nặng (trang chủ, màn Thiết bị toàn ngành) một node
# tính thì node khác dùng lại, và sổ phiên đăng nhập (đăng xuất / đổi mật khẩu cắt phiên ngay trên mọi node).
# Không khai REDIS_HOST thì không dùng Redis — mọi thứ chạy như cũ từ CSDL (SharedCache).
app.cache.redis.host=${REDIS_HOST:}
app.cache.redis.port=${REDIS_PORT:6379}
app.cache.redis.password=${REDIS_PASSWORD:}
app.cache.redis.timeout=${REDIS_TIMEOUT:500ms}
# Kết nối Redis dựng ở SharedCacheConfig, chỉ khi có REDIS_HOST: bản tự động của Spring Boot luôn nối
# localhost:6379 và báo /actuator/health DOWN khi không có Redis — ở đây không có Redis là hợp lệ.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
