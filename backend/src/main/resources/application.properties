spring.application.name=sfems

# --- Web --------------------------------------------------------------------
# Cổng HTTP. Đổi khỏi 8080 mặc định vì máy phát triển thường đã có thứ khác
# chiếm cổng đó; ghi đè bằng biến môi trường SERVER_PORT thay vì sửa file này
# cho từng máy.
server.port=8888
# Sau nginx: Tomcat lấy IP client từ X-Forwarded-For, nhưng CHỈ tin phần do proxy nội bộ thêm vào —
# giới hạn số lần đăng nhập theo IP (LoginRateLimitFilter) dựa vào đây.
server.forward-headers-strategy=native

# --- Datasource -------------------------------------------------------------
# Local PostgreSQL. Override any of these with the matching SPRING_DATASOURCE_*
# environment variable rather than editing this file per machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/sfems
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikari mặc định 10 kết nối. Mỗi yêu cầu giữ một kết nối suốt giao dịch, nên
# pool là trần số yêu cầu chạy song song; đặt theo số lõi máy chủ CSDL (khoảng
# 2 × lõi + số ổ), không theo số người dùng.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only validates that the entities and the
# migrated tables still agree, so a drifted mapping fails at startup instead of
# at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Nạp quan hệ theo lô: một danh sách 20 phiếu, mỗi phiếu vài dòng, mỗi dòng một
# tài sản kéo nhóm / phòng / cán bộ — không có dòng này là mỗi thứ một câu SELECT
# riêng, và dưới tải các câu đó xếp hàng chờ kết nối. Đo tại máy (100 luồng):
# danh sách phiếu mượn p50 2,7 s -> xem ghi chú P9.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Liên kết EAGER chỉ được JOIN MỘT tầng; sâu hơn thì nạp bằng SELECT riêng (gom lô 50
# theo dòng trên). Mặc định Hibernate JOIN theo cả chuỗi EAGER: danh sách phiếu nhập ra
# một câu JOIN 45 bảng (dòng phiếu -> phòng -> khối nhà -> cơ sở -> cán bộ -> trường...),
# local 0,15 s nhưng server dev 25,7 s — Postgres lập kế hoạch cho 45 bảng tốn CPU. Đặt
# ở đây thay vì @Fetch(SELECT) từng trường để thực thể MỚI khai EAGER cũng không tái
# phát. Đo local: câu rộng nhất 45 -> 5 JOIN, số câu 9 -> 11, JSON trả về giống hệt.
spring.jpa.properties.hibernate.max_fetch_depth=1

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# --- JSON -------------------------------------------------------------------
# Jackson 3 (Boot 4) already writes java.time values as ISO-8601 strings, which
# is what the admin UI needs 'new Date()' to be able to parse; only the zone
# has to be pinned so timestamps do not shift with the server default.
spring.jackson.time-zone=UTC
# Số lẻ gửi vào ô số NGUYÊN là lỗi, không phải thứ để cắt bớt: mặc định Jackson nhận 1.5 cho một ô
# Integer và lặng lẽ lưu 1 — phiếu nhập "1,5 cái" thành 1 cái mà không ai được báo.
spring.jackson.deserialization.accept-float-as-int=false

# --- Security ---------------------------------------------------------------
# HMAC key the access tokens are signed with. HS256 needs at least 32 bytes and
# the application refuses to start with less. The value below is a development
# default and is in version control, which is exactly why every deployment must
# override it with APP_SECURITY_JWT_SECRET: anyone holding this string can
# mint a token for any account.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
# Tên stack khi chạy trên máy chủ (sfems_dev, sfems_main); trống trên máy dev. Có tên stack thì không
# khởi động với khoá JWT mặc định ở trên; sfems_main còn tự khoá tài khoản demo (DeployStack).
app.stack=${APP_STACK:}
# sfems_main khoá cả 'admin' nếu còn mật khẩu seed; true = giữ 'admin' mở MỘT lần để vào đổi mật khẩu (DemoAccountGuard).
app.security.keep-seeded-admin=${APP_KEEP_SEEDED_ADMIN:false}
app.security.jwt.issuer=sfems
# Short, because nothing can revoke an access token before it expires: this is
# how long a role change or a disabled account takes to actually bite.
app.security.jwt.access-token-ttl=15m
# How long a session survives without signing in again. Rotated on every use.
app.security.jwt.refresh-token-ttl=7d

# --- CORS -------------------------------------------------------------------
# The Vite dev server. Vite selects the next free port when a local instance is
# already running, so allow localhost development origins on any port.
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# --- HTTP connector ---------------------------------------------------------
# Square brackets are legal here because Refine's data provider sends them:
# `getMany` builds `?ids[0]=1&ids[1]=2` through qs, which encodes values but not
# keys, and the browser's URL parser leaves `[` and `]` alone in a query string.
#
# Tomcat rejects them by default -- they are gen-delims that RFC 3986 does not
# permit outside a host -- and it does so in the connector, before any filter
# runs. That produces a 400 HTML page with no CORS headers, so the browser
# reports the failure as a CORS error on the preflight and the real cause is
# nowhere in it. `ListParams.ids()` already parses `ids[0]`; the request simply
# never reached it.
#
# Two characters, in the query string only. The path parser is untouched.
server.tomcat.relaxed-query-chars=[,]

# --- Actuator ---------------------------------------------------------------
# Health only, and details only for a caller that authenticated. The row-level
# indicator turns the check DOWN while any policy is quarantined and lists which
# ones -- a policy that is not applying is a security control that is not
# applying, and the whole point of quarantining rather than refusing to start is
# that it must not then be invisible. Without details the check says DOWN and
# nothing else, which is a page at 3am with nowhere to go.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized


# --- Tệp đính kèm -------------------------------------------------------------
# Controller tự giới hạn 10 MB và nói bằng tiếng Việt; giới hạn ở đây cao hơn một
# chút để request tới được controller thay vì bị servlet cắt với lỗi chung.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Nội dung tệp nằm trong MinIO; database chỉ giữ tên, loại, dung lượng và khoá đối tượng.
# Dev: `docker compose -f backend/compose.yaml up -d minio` (bảng điều khiển ở :9101).
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9100}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:sfems}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:sfems-dev-secret}
app.storage.bucket=${APP_STORAGE_BUCKET:sfems-attachments}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
# Thông số riêng từng máy (MinIO dùng chung của nhóm, mật khẩu...) để trong
# backend/application-local.properties — đã gitignore; mẫu ở application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# ---- P9: sao lưu và cảnh báo dung lượng
# pg_dump phải có trên PATH, hoặc đặt đường dẫn đầy đủ qua APP_BACKUP_PG_DUMP.
app.backup.pg-dump=${APP_BACKUP_PG_DUMP:pg_dump}
# pg_restore cho nút Khôi phục (QLTB-247); để trống thì lấy cạnh pg_dump.
app.backup.pg-restore=${APP_BACKUP_PG_RESTORE:}
# Nên là một ổ khác ổ chứa cơ sở dữ liệu.
app.backup.dir=${APP_BACKUP_DIR:./backups}
app.backup.retention=14
app.backup.cron=0 30 1 * * *
app.backup.max-age-hours=36
app.capacity.disk-min-free-gb=5
app.capacity.database-max-gb=50
app.capacity.check-cron=0 0 6 * * *

# ---- Tài liệu API (QLTB-449): /swagger-ui.html, /v3/api-docs. Tắt trên môi trường không muốn lộ: APP_API_DOCS=false.
springdoc.api-docs.enabled=${APP_API_DOCS:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ---- Bộ nhớ đệm dùng chung (Redis) -----------------------------------------------------------
# Mức 2 sau bộ nhớ đệm trong từng node và sổ phiên đăng nhập (đăng xuất / đổi mật khẩu cắt phiên ngay trên
# mọi node). Không khai REDIS_HOST thì không dùng Redis — mọi thứ chạy từ CSDL (SharedCache).
app.cache.redis.host=${REDIS_HOST:}
app.cache.redis.port=${REDIS_PORT:6379}
app.cache.redis.password=${REDIS_PASSWORD:}
app.cache.redis.timeout=${REDIS_TIMEOUT:500ms}
# Kết nối Redis dựng ở SharedCacheConfig, chỉ khi có REDIS_HOST: bản tự động của Spring Boot luôn nối
# localhost:6379 và báo /actuator/health DOWN khi không có Redis — ở đây không có Redis là hợp lệ.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
