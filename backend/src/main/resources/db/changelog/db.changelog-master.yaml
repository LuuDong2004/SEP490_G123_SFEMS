# Điểm vào của Liquibase (spring.liquibase.change-log). Thêm changelog mới là thêm một dòng include ở đây.
# Hibernate chỉ kiểm (ddl-auto=validate): mọi bảng của entity phải được tạo ở đây.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-nen-toi-thieu.sql
  - include:
      file: db/changelog/changes/002-tai-khoan-vai-tro-quyen.sql
