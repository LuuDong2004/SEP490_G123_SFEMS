# Phường/Xã TP.HCM theo cấu trúc 2025 (không còn cấp quận/huyện). Cùng hình
# dạng CatalogEntity, khuôn bảng chép nguyên từ 018.
databaseChangeLog:
  - changeSet:
      id: 020-create-wards
      author: dth
      changes:
        - createTable:
            tableName: wards
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_wards
              - column:
                  name: code
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_wards_code
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: integer
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: created_by_id
                  type: bigint
              - column:
                  name: updated_by_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: wards
            baseColumnNames: created_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_wards_created_by
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: wards
            baseColumnNames: updated_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_wards_updated_by
            onDelete: SET NULL
        - createIndex:
            tableName: wards
            indexName: idx_wards_sort
            columns:
              - column:
                  name: sort_order
              - column:
                  name: name
