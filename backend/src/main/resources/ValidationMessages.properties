# Câu mặc định của Bean Validation, bằng tiếng Việt.
#
# Hơn 160 ràng buộc trên các request DTO (@Size, @NotBlank, @NotNull…) không khai `message`, nên
# trước đây người dùng nhận câu mặc định tiếng Anh của Hibernate Validator ngay dưới ô nhập
# ("size must be between 0 and 255"). Tệp này đổi câu mặc định cho TẤT CẢ một lần; ràng buộc nào
# cần câu riêng thì vẫn khai `message` tại chỗ.
jakarta.validation.constraints.NotNull.message=Bắt buộc nhập
jakarta.validation.constraints.NotBlank.message=Bắt buộc nhập
jakarta.validation.constraints.NotEmpty.message=Bắt buộc nhập
jakarta.validation.constraints.Size.message=${min > 0 && max < 2147483647 ? 'Phải từ ' += min += ' đến ' += max += ' ký tự' : (min > 0 ? 'Tối thiểu ' += min += ' ký tự' : 'Tối đa ' += max += ' ký tự')}
jakarta.validation.constraints.Min.message=Phải lớn hơn hoặc bằng {value}
jakarta.validation.constraints.Max.message=Phải nhỏ hơn hoặc bằng {value}
jakarta.validation.constraints.DecimalMin.message=Phải lớn hơn hoặc bằng {value}
jakarta.validation.constraints.DecimalMax.message=Phải nhỏ hơn hoặc bằng {value}
jakarta.validation.constraints.Positive.message=Phải lớn hơn 0
jakarta.validation.constraints.PositiveOrZero.message=Không được là số âm
jakarta.validation.constraints.Negative.message=Phải nhỏ hơn 0
jakarta.validation.constraints.NegativeOrZero.message=Không được là số dương
jakarta.validation.constraints.Digits.message=Số không hợp lệ (tối đa {integer} chữ số phần nguyên, {fraction} chữ số thập phân)
jakarta.validation.constraints.Email.message=Email không đúng định dạng
jakarta.validation.constraints.Pattern.message=Không đúng định dạng
jakarta.validation.constraints.Past.message=Phải là một thời điểm trong quá khứ
jakarta.validation.constraints.PastOrPresent.message=Không được ở tương lai
jakarta.validation.constraints.Future.message=Phải là một thời điểm trong tương lai
jakarta.validation.constraints.FutureOrPresent.message=Không được ở quá khứ
jakarta.validation.constraints.AssertTrue.message=Chưa thoả điều kiện
jakarta.validation.constraints.AssertFalse.message=Chưa thoả điều kiện
jakarta.validation.constraints.Null.message=Không được nhập
