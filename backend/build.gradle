plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.g123'
version = '0.0.1-SNAPSHOT'
description = 'sfems'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Bộ nhớ đệm dùng chung giữa các node: mức 2 của cache tổng hợp và sổ phiên đăng nhập — xem
    // shared/cache/SharedCache. Không khai REDIS_HOST thì không dùng, mọi thứ chạy từ CSDL.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Authentication / authorisation. The resource-server starter is what pulls
    // in Nimbus JOSE, which is how access tokens are signed and verified — see
    // shared/security/JwtService.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // The live channel. STOMP over WebSocket rather than raw frames, because it
    // is what lets the access token travel in the CONNECT frame -- the browser's
    // WebSocket constructor cannot set an Authorization header.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Row-level security reports two things an operator has to be able to see
    // without reading logs: whether any policy had to be quarantined at boot
    // (RowLevelHealthIndicator), and how often the deliberate bypass is used
    // (the rowlevel.bypass counter). Both need actuator, and it is what brings
    // Micrometer with it.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Not runtimeOnly: PostgresEventBus compiles against PGConnection to
    // hold a LISTEN subscription, which is how permission changes and
    // notifications reach the other nodes. That is the one place this
    // application knows which database it is talking to.
    implementation 'org.postgresql:postgresql'
    // Nội dung tệp đính kèm nằm trong MinIO (S3), database chỉ giữ khoá — xem shared/storage.
    implementation 'io.minio:minio:8.5.17'
    // Tài liệu API (QLTB-449, 252): /v3/api-docs và /swagger-ui.html; tắt bằng APP_API_DOCS=false.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Source files are UTF-8, and on Windows javac would otherwise read them with
// the platform charset -- which is silent for comments and javadoc, and turns
// any non-ASCII character in a *string literal* into mojibake the first time
// somebody sees it in an API response or a health check.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
